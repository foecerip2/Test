<title>VAYLO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept: VAYLO — спокойный сине-зелёный, как глубокая вода, и тёплый коралловый для действий.
   Вся мысль страницы — «путь трафика»: открытый путь пунктиром, защищённый — сплошной линией. */
:root {
  --bg: #EEF3F3; --surface: #FFFFFF; --surface-2: #E6EDED; --ink: #0B1A22; --muted: #52656C; --line: #D0DBDC;
  --brand: #0F4C5C; --brand-ink: #FFFFFF; --brand-soft: #DCEDEE; --accent: #FF6B4A; --accent-ink: #1C0A05;
  --ok: #0E8A63; --bad: #C23B22; --warn: #B7791F; --focus: #0F4C5C;
  --night: #0A1C25; --night-2: #12303C; --feat-bg: #0B2A35; --feat-ink: #EAF4F2;
  --shadow: 0 22px 44px -26px rgba(11, 26, 34, .5);
  --f-d: "Geologica", system-ui, sans-serif; --f-b: "Onest", system-ui, sans-serif; --f-m: "IBM Plex Mono", ui-monospace, monospace;
  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1); --hdr: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1419; --surface: #111F27; --surface-2: #172932; --ink: #E8F1F0; --muted: #93A8AE; --line: #243741;
    --brand: #4DC7B4; --brand-ink: #04211C; --brand-soft: #12333B; --accent: #FF7F61; --ok: #4ED0A0; --bad: #FF8B76; --warn: #E3B04F; --focus: #4DC7B4;
    --feat-bg: #173B48; --shadow: 0 22px 44px -26px rgba(0, 0, 0, .8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1419; --surface: #111F27; --surface-2: #172932; --ink: #E8F1F0; --muted: #93A8AE; --line: #243741;
  --brand: #4DC7B4; --brand-ink: #04211C; --brand-soft: #12333B; --accent: #FF7F61; --ok: #4ED0A0; --bad: #FF8B76; --warn: #E3B04F; --focus: #4DC7B4;
  --feat-bg: #173B48; --shadow: 0 22px 44px -26px rgba(0, 0, 0, .8); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: calc(var(--hdr) + 16px); }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-b); overflow-x: hidden; margin: 0; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
main:focus { outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1160px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sec { padding-block: 72px; }
.sec.tight { padding-block: 48px; }
.ic { flex: none; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); border: 0; padding: 10px 14px; border-radius: 8px; transition: top 160ms ease-out; }
.skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }

/* ───── типографика ───── */
h1, h2, h3 { font-family: var(--f-d); letter-spacing: -.025em; text-wrap: balance; }
h1 { font-size: clamp(34px, 5.2vw, 60px); line-height: 1.04; font-weight: 600; }
h2 { font-size: clamp(26px, 3.3vw, 40px); line-height: 1.12; font-weight: 600; }
h3 { font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; }
.lead { font-size: clamp(17px, 1.6vw, 19px); color: var(--muted); max-width: 52ch; }
.eyebrow { font: 500 12.5px var(--f-m); letter-spacing: .1em; text-transform: uppercase; color: var(--brand); display: inline-flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ""; width: 18px; height: 2px; background: currentColor; border-radius: 2px; }
.sec-head { display: grid; gap: 12px; margin-bottom: 40px; max-width: 62ch; }
.sec-head p { color: var(--muted); }
.mono { font-family: var(--f-m); }

/* ───── кнопки ───── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; transition: transform 160ms ease-out, background-color 160ms ease, border-color 160ms ease; }
.btn:active { transform: scale(.97); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-brand { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14.5px; border-radius: 10px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn-danger[data-armed="1"] { background: var(--bad); color: #fff; border-color: var(--bad); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--ink); }
  .btn-accent:hover { background: color-mix(in srgb, var(--accent), #fff 12%); }
  .btn-brand:hover { background: color-mix(in srgb, var(--brand), #000 12%); border-color: transparent; }
  .nav a:hover, .drawer a:hover { background: var(--surface-2); }
  .card.link:hover { border-color: var(--ink); }
}

/* ───── шапка ───── */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--hdr); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--bg); }
.hdr .wrap { height: 100%; display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 700 20px var(--f-d); letter-spacing: .08em; }
.nav { display: flex; gap: 2px; margin-left: 12px; }
.nav a { padding: 8px 12px; border-radius: 9px; text-decoration: none; font-weight: 500; color: var(--muted); transition: background-color 160ms ease, color 160ms ease; }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.hdr-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid transparent; background: transparent; transition: background-color 160ms ease, transform 160ms ease-out; }
.icon-btn:active { transform: scale(.94); }
.icon-btn:hover { background: var(--surface-2); }
.burger { display: none; }
.drawer-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(5, 12, 16, .55); opacity: 0; pointer-events: none; transition: opacity 240ms ease-out; }
.drawer-scrim.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: min(340px, 86vw); background: var(--surface); border-left: 1px solid var(--line); padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px; transform: translateX(105%); visibility: hidden; transition: transform 240ms var(--ease-out), visibility 0s 240ms; }
.drawer.open { transform: none; visibility: visible; transition: transform 340ms var(--ease-drawer); }
.drawer a { padding: 13px 12px; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: 17px; }
.drawer .btn { margin-top: 8px; }
.drawer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

/* ───── главная ───── */
.hero { padding-block: 40px 64px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.hero-copy { display: grid; gap: 22px; justify-items: start; }
.fine { font-size: 14px; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.facts li { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font: 500 13px var(--f-m); }
.facts .ic { color: var(--brand); }

.dev { background: linear-gradient(165deg, var(--night-2), var(--night) 62%); color: #E8F1F0; border-radius: 26px; padding: 18px; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, .06); }
.dev-top { display: flex; justify-content: space-between; align-items: center; font: 500 12px var(--f-m); letter-spacing: .06em; text-transform: uppercase; color: #8CA7AF; }
.dev-top .tag { padding: 3px 9px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 99px; }
.route { display: block; width: 100%; height: auto; margin: 6px 0 2px; }
.route text { font: 500 13px var(--f-m); fill: #8CA7AF; }
.route .node { fill: #12303C; stroke: #35505C; stroke-width: 2; transition: stroke 300ms ease, fill 300ms ease; }
.route .direct { fill: none; stroke: #FF8B76; stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; transition: opacity 300ms ease; }
.route .tun { fill: none; stroke: #3CC6B4; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 600ms var(--ease-out); }
.dev[data-on="1"] .direct { opacity: .14; }
.dev[data-on="1"] .tun { stroke-dashoffset: 0; }
.dev[data-on="1"] .node.srv { stroke: #3CC6B4; fill: #134A47; }
.route .eye { transition: opacity 300ms ease; } .dev[data-on="1"] .route .eye { opacity: 0; }
.route .lock { opacity: 0; transition: opacity 300ms ease 300ms; } .dev[data-on="1"] .route .lock { opacity: 1; }
.dev-main { display: flex; align-items: center; gap: 16px; padding: 10px 4px 14px; }
.dev-state { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dev-state b { font: 600 22px var(--f-d); letter-spacing: -.02em; transition: color 240ms ease; color: #FF8B76; }
.dev[data-on="1"] .dev-state b { color: #4FD8C2; } .dev[data-busy="1"] .dev-state b { color: #E8F1F0; }
.dev-state span { font-size: 14px; color: #9DB5BC; }
.pw { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 2px solid #35505C; background: #14323E; color: #fff; display: grid; place-items: center; transition: background-color 240ms ease, border-color 240ms ease, transform 160ms ease-out; flex: none; }
.pw:active { transform: scale(.95); }
.dev[data-on="1"] .pw { background: #1E9C88; border-color: #4FD8C2; color: #04211C; }
.pw .spin { position: absolute; inset: -6px; opacity: 0; }
.dev[data-busy="1"] .pw .spin { opacity: 1; animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pw .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #4FD8C2; opacity: 0; pointer-events: none; }
.dev-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255, 255, 255, .07); border-radius: 14px; overflow: hidden; }
.dev-rows div { background: #0F2530; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.dev-rows small { font: 500 11px var(--f-m); letter-spacing: .06em; text-transform: uppercase; color: #7E9AA2; }
.dev-rows b { font: 500 14.5px var(--f-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-srv { margin-top: 12px; display: grid; gap: 6px; }
.dev-srv label { font: 500 12px var(--f-m); color: #8CA7AF; letter-spacing: .06em; text-transform: uppercase; }
.dev-srv select { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14); background: #0F2530; color: #E8F1F0; padding: 0 12px; }
.dev-note { font-size: 12.5px; color: #7E9AA2; margin-top: 10px; }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 10px; align-content: start; transition: border-color 160ms ease; }
.card p { color: var(--muted); font-size: 15.5px; }
.ico { width: 46px; height: 46px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin-bottom: 4px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
.step { position: relative; padding: 24px 24px 24px 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.step .n { font: 500 13px var(--f-m); color: var(--brand); letter-spacing: .08em; }
.step p { color: var(--muted); font-size: 15.5px; }
.plats { display: flex; flex-wrap: wrap; gap: 10px; }
.plat { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 600; transition: border-color 160ms ease, transform 160ms ease-out; }
.plat:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .plat:hover { border-color: var(--ink); } }
.band { background: var(--surface); border-block: 1px solid var(--line); }
.cta-band { background: var(--brand); color: var(--brand-ink); border-radius: 28px; padding: 48px 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.cta-band p { opacity: .85; margin-top: 8px; max-width: 48ch; }

/* ───── тарифы ───── */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
.plan { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.plan > .btn { margin-top: auto; }
.plan .checks { margin-bottom: 8px; }
.plan.feat { background: var(--feat-bg); color: var(--feat-ink); border-color: transparent; box-shadow: var(--shadow); }
.plan .badge { position: absolute; top: 20px; right: 20px; font: 500 12px var(--f-m); padding: 4px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.plan h3 { font-size: 20px; }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price b { font: 600 46px/1 var(--f-d); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.price span { color: var(--muted); } .plan.feat .price span { color: #A9C4C8; }
.plan .sub { font-size: 14.5px; color: var(--muted); } .plan.feat .sub { color: #A9C4C8; }
.save { display: inline-block; font: 500 12.5px var(--f-m); color: var(--ok); } .plan.feat .save { color: #6BE3C2; }
.checks { display: grid; gap: 10px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; }
.checks .ic { color: var(--ok); margin-top: 3px; } .plan.feat .checks .ic { color: #6BE3C2; }
.note-box { display: flex; gap: 14px; align-items: flex-start; padding: 20px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.note-box .ic { color: var(--brand); margin-top: 3px; }
.note-box p { color: var(--muted); }

/* ───── формы ───── */
.fld { display: grid; gap: 6px; }
.fld label { font-weight: 600; font-size: 14.5px; }
.fld .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; transition: border-color 160ms ease, box-shadow 160ms ease; }
.fld textarea { padding: 12px 14px; min-height: 130px; resize: vertical; line-height: 1.5; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 28%, transparent); }
.fld [aria-invalid="true"] { border-color: var(--bad); }
.fld .hint { font-size: 13px; color: var(--muted); }
.fld .err { font-size: 13.5px; color: var(--bad); min-height: 0; }
.fld .err:empty { display: none; }
.pwf { position: relative; } .pwf input { padding-right: 52px; }
.pwf button { position: absolute; right: 4px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--muted); }
.meter { display: flex; gap: 4px; margin-top: 2px; } .meter i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background-color 200ms ease; }
.meter[data-s="1"] i:nth-child(-n+1) { background: var(--bad); } .meter[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
.meter[data-s="3"] i:nth-child(-n+3) { background: var(--ok); } .meter[data-s="4"] i { background: var(--ok); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--muted); }
.check input { width: 22px; height: 22px; min-height: 0; margin-top: 2px; accent-color: var(--brand); flex: none; }
.form { display: grid; gap: 16px; }
.form-msg { padding: 12px 14px; border-radius: 12px; font-size: 14.5px; background: var(--brand-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--line)); }
.form-msg.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

.auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 56px; align-items: center; min-height: calc(100vh - var(--hdr) - 180px); }
.auth-aside { display: grid; gap: 20px; justify-items: start; }
.auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); display: grid; gap: 20px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: var(--surface-2); border-radius: 14px; gap: 4px; }
.tabs a { text-align: center; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 600; color: var(--muted); transition: background-color 160ms ease, color 160ms ease; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ───── FAQ ───── */
.faq-tools { display: grid; gap: 12px; margin-bottom: 20px; }
.search { position: relative; } .search .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); }
.search input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 44px; }
.search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 28%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 14.5px; transition: background-color 160ms ease, color 160ms ease, transform 160ms ease-out; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.faq { display: grid; gap: 10px; }
.faq-i { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.faq-i > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; background: none; border: 0; padding: 18px 20px; font: 600 16.5px/1.35 var(--f-b); min-height: 56px; }
.faq-i .ic { transition: transform 220ms var(--ease-out); color: var(--muted); }
.faq-i.open .ic { transform: rotate(180deg); }
.faq-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease-out); }
.faq-i.open .faq-a { grid-template-rows: 1fr; }
.faq-a > div { overflow: hidden; } .faq-a p { padding: 0 20px 20px; color: var(--muted); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
.support { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.sticky { position: sticky; top: calc(var(--hdr) + 20px); }

/* ───── инструкции ───── */
.setup { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
.ptabs { display: grid; gap: 4px; position: sticky; top: calc(var(--hdr) + 20px); }
.ptabs a { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; text-decoration: none; font-weight: 600; color: var(--muted); border: 1px solid transparent; transition: background-color 160ms ease, color 160ms ease; }
.ptabs a[aria-current="page"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
.manual { display: grid; gap: 28px; }
.manual ol { display: grid; gap: 14px; counter-reset: st; }
.manual li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; counter-increment: st; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return; var a = t.dataset.act;
    if (a === 'theme') { var d = document.documentElement, dark = d.dataset.theme === 'dark' || (!d.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); d.dataset.theme = dark ? 'light' : 'dark'; store.set('vaylo.theme', d.dataset.theme); renderChrome(); }
    else if (a === 'menu') openMenu(); else if (a === 'close-menu') closeMenu();
    else if (a === 'demo') demoToggle();
    else if (a === 'pw-toggle') { var i = t.parentNode.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; t.setAttribute('aria-label', i.type === 'password' ? 'Показать пароль' : 'Скрыть пароль'); t.innerHTML = ic(i.type === 'password' ? 'eye' : 'eyeoff'); }
    else if (a === 'faq') { var it = t.parentNode, open = !it.classList.contains('open'); it.classList.toggle('open', open); t.setAttribute('aria-expanded', open); }
    else if (a === 'cat') { document.querySelectorAll('[data-act="cat"]').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); }); faqFilter(); }
    else if (a === 'pick-plan') { if (me()) applyPlan(t.dataset.plan); else { store.set('vaylo.pending', t.dataset.plan); location.hash = '#register'; } }
    else if (a === 'logout') { store.del('vaylo.session'); toast('Вы вышли из аккаунта'); location.hash = '#home'; if (!location.hash || location.hash === '#home') render(); }
    else if (a === 'forgot') { var f = $('forgot'); f.hidden = !f.hidden; if (!f.hidden) $('f-femail').focus(); }
    else if (a === 'forgot-send') { var v = $('f-femail').value.trim(); if (!emailOk(v)) { toast('Введите корректный адрес почты'); return; } toast('Если такой аккаунт есть, мы отправим ссылку для сброса. В демо-версии письма не уходят.'); }
    else if (a === 'cfg') { var box = $('cfg-' + t.dataset.id); box.hidden = !box.hidden; }
    else if (a === 'copy-cfg') { var ta = $('cfg-' + t.dataset.id).querySelector('textarea'); copyText(ta.value); }
    else if (a === 'copy-code') { copyText(t.parentNode.textContent.trim()); }
    else if (a === 'del-dev') { if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Точно удалить?'; setTimeout(function () { if (t.isConnected) { t.dataset.armed = '0'; t.textContent = 'Удалить'; } }, 3500); return; } patchMe(function (u) { u.devices = u.devices.filter(function (d) { return d.id !== t.dataset.id; }); }); toast('Устройство удалено'); render(); }
    else if (a === 'del-acc') { if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Подтвердите удаление'; setTimeout(function () { if (t.isConnected) { t.dataset.armed = '0'; t.textContent = 'Удалить аккаунт'; } }, 3500); return; } var em = store.get('vaylo.session', null); saveUsers(users().filter(function (u) { return u.email !== em; })); store.set('vaylo.tickets', store.get('vaylo.tickets', []).filter(function (x) { return x.email !== em; })); store.del('vaylo.session'); toast('Аккаунт удалён'); location.hash = '#home'; render(); }
  });
  $('skip').addEventListener('click', function () { $('main').focus(); });
  $('scrim').addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'd-srv') { demo.srv = +e.target.value; if (demo.on) { demo.busy = true; demoRender(); setTimeout(function () { demo.busy = false; demoRender(); }, reduce.matches ? 40 : 600); } }
  });
  function faqFilter() {
    var q = ($('faq-q').value || '').trim().toLowerCase(), cat = (document.querySelector('[data-act="cat"][aria-pressed="true"]') || {}).dataset;
    cat = cat ? cat.cat : 'Все';
    $('faq-box').innerHTML = faqHtml(FAQ.filter(function (f) { return (cat === 'Все' || f[0] === cat) && (!q || (f[1] + ' ' + f[2]).toLowerCase().indexOf(q) >= 0); }));
  }
  document.addEventListener('input', function (e) {
    if (e.target.id === 'faq-q') faqFilter();
    if (e.target.name === 'password') { var m = $('meter'); if (m) m.dataset.s = e.target.value ? pwScore(e.target.value) : 0; }
    if (e.target.matches && e.target.matches('[aria-invalid="true"]')) { var f = e.target.closest('form'); setErr(f, e.target.name, ''); }
  });

  /* ───────── формы ───────── */
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
    var kind = f.dataset.form, btn = f.querySelector('[type="submit"]'), v = function (n) { var el = f.elements[n]; return el ? (el.type === 'checkbox' ? el.checked : el.value.trim()) : ''; };
    var msg = f.querySelector('#fmsg'), ok = true, first = null;
    var bad = function (n, t) { setErr(f, n, t); if (!first) first = f.elements[n]; ok = false; };
    if (msg) msg.hidden = true;
    if (kind === 'login' || kind === 'register') {
      var em = v('email').toLowerCase(), pw = f.elements.password.value;
      if (!emailOk(em)) bad('email', 'Введите адрес почты в формате name@example.com'); else setErr(f, 'email', '');
      if (!pw) bad('password', 'Введите пароль'); else if (kind === 'register' && (pw.length < 8 || /^\d+$/.test(pw))) bad('password', 'Пароль должен быть не короче 8 символов и не состоять только из цифр'); else setErr(f, 'password', '');
      if (kind === 'register') { if (!v('terms')) { $('e-terms').textContent = 'Нужно принять условия, чтобы продолжить'; ok = false; if (!first) first = f.elements.terms; } else $('e-terms').textContent = ''; }
      if (!ok) { first.focus(); return; }
      busy(btn, true, kind === 'register' ? 'Создаём аккаунт…' : 'Входим…');
      var found = users().filter(function (u) { return u.email === em; })[0];
      if (kind === 'register') {
        if (found) { busy(btn, false); setErr(f, 'email', 'Аккаунт с такой почтой уже есть. Войдите или восстановите пароль.'); f.elements.email.focus(); return; }
        var salt = b64(rnd(16));
        hashPw(pw, salt).then(function (h) {
          var all = users(); all.push({ email: em, salt: salt, hash: h, created: Date.now(), sub: { plan: 'trial', until: Date.now() + 7 * DAY }, devices: [] }); saveUsers(all);
          store.set('vaylo.session', em); toast('Аккаунт создан. Пробный период — 7 дней.'); location.hash = store.get('vaylo.pending', null) ? '#account-plan' : '#account'; if (!location.hash) render();
        });
      } else {
        if (!found) { busy(btn, false); msg.textContent = 'Неверная почта или пароль.'; msg.hidden = false; return; }
        hashPw(pw, found.salt).then(function (h) {
          if (h !== found.hash) { busy(btn, false); msg.textContent = 'Неверная почта или пароль.'; msg.hidden = false; return; }
          store.set('vaylo.session', em); var go = store.get('vaylo.after', null); store.del('vaylo.after'); toast('Вы вошли в аккаунт'); location.hash = '#' + (go || 'account'); render();
        });
      }
    } else if (kind === 'device') {
      var nm = v('name'); if (!nm) bad('name', 'Введите название устройства'); else setErr(f, 'name', '');
      if (!ok) { first.focus(); return; }
      var plat = PLATFORMS.filter(function (p) { return p[1] === v('platform'); })[0][0], u = me();
      if (u.devices.length >= 5) { toast('Достигнут лимит в 5 устройств'); return; }
      patchMe(function (x) { x.devices.push({ id: 'd' + Date.now().toString(36), name: nm, platform: plat, created: Date.now(), config: genConfig(x.devices.length + 1) }); });
      toast('Устройство добавлено'); render();
      var last = me().devices.slice(-1)[0]; var box = $('cfg-' + last.id); if (box) { box.hidden = false; box.scrollIntoView({ block: 'center', behavior: reduce.matches ? 'auto' : 'smooth' }); }
    } else if (kind === 'password') {
      var old = f.elements.old.value, np = f.elements.password.value, u2 = me();
      if (!old) bad('old', 'Введите текущий пароль'); else setErr(f, 'old', '');
      if (np.length < 8 || /^\d+$/.test(np)) bad('password', 'Новый пароль: не короче 8 символов и не только цифры'); else setErr(f, 'password', '');
      if (!ok) { first.focus(); return; }
      busy(btn, true, 'Проверяем…');
      hashPw(old, u2.salt).then(function (h) {
        if (h !== u2.hash) { busy(btn, false); setErr(f, 'old', 'Текущий пароль указан неверно'); f.elements.old.focus(); return; }
        var salt = b64(rnd(16)); hashPw(np, salt).then(function (h2) { patchMe(function (x) { x.salt = salt; x.hash = h2; }); busy(btn, false); f.reset(); var m = $('meter'); if (m) m.dataset.s = 0; toast('Пароль изменён'); });
      });
    } else if (kind === 'support') {
      var nme = v('name'), mail = v('email'), text = v('message');
      if (!nme) bad('name', 'Представьтесь, чтобы мы знали, как к вам обращаться'); else setErr(f, 'name', '');
      if (!emailOk(mail)) bad('email', 'Введите адрес почты в формате name@example.com'); else setErr(f, 'email', '');
      if (text.length < 10) bad('message', 'Опишите вопрос подробнее, хотя бы в 10 символов'); else setErr(f, 'message', '');
      if (!v('consent')) { $('e-consent').textContent = 'Нужно согласие на обработку данных'; ok = false; if (!first) first = f.elements.consent; } else $('e-consent').textContent = '';
      if (!ok) { first.focus(); return; }
      busy(btn, true, 'Отправляем…');
      setTimeout(function () {
        var id = 'VAY-' + (1000 + Math.floor(Math.random() * 9000)), all = store.get('vaylo.tickets', []);
        all.push({ id: id, email: mail.toLowerCase(), topic: v('topic'), message: text, created: Date.now() }); store.set('vaylo.tickets', all);
        f.innerHTML = '<div class="ico">' + ic('check', 26) + '</div><h3>Обращение принято</h3><p>Номер обращения <b class="mono">' + id + '</b>. Ответ придёт на ' + esc(mail) + ' обычно в течение рабочего дня.</p><div><button class="btn btn-ghost btn-sm" type="button" data-act="again">Написать ещё</button></div>';
        f.removeAttribute('data-form'); f.querySelector('[data-act="again"]').addEventListener('click', function () { render(); });
        f.setAttribute('tabindex', '-1'); f.focus();
      }, reduce.matches ? 30 : 600);
    }
  });

  /* ───────── старт ───────── */
  var th = store.get('vaylo.theme', null); if (th) document.documentElement.dataset.theme = th;
  render();
})();
</script>
