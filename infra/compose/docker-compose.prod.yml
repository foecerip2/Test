# VPS-1 (control plane). Сейчас: web + caddy. API/PostgreSQL/Redis добавляются в Фазе 2.
name: leadhunter

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE не задан}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан}
      BASIC_USER: ${BASIC_USER:?}
      BASIC_HASH: ${BASIC_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
