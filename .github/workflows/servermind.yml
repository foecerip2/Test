# ServerMind CI/CD.
#   PR и push:   тесты backend / web / bootstrap + сборка и smoke-запуск образов.
#   push в main: публикация образов в GHCR (sha-<commit>) и — после ручного одобрения окружения `production` —
#                перемещение тега `stable`. VPS сам замечает новый digest `stable` и обновляется (pull-based, см. docs/operations/deployment.md).
# Если проект вынесен в отдельный репозиторий (servermind/ в корне) — уберите префикс `servermind/` в путях.
name: servermind

on:
  push:
    branches: [main]
    paths: ["servermind/**", ".github/workflows/servermind.yml"]
  pull_request:
    paths: ["servermind/**", ".github/workflows/servermind.yml"]
  workflow_dispatch:

concurrency:
  group: servermind-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (pytest, ruff)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: servermind/apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servermind
          POSTGRES_PASSWORD: servermind_test_only
          POSTGRES_DB: servermind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servermind -d servermind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://servermind:servermind_test_only@127.0.0.1:5432/servermind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # версия прода (в песочнице разработки тесты шли на 3.13)
          cache: pip
          cache-dependency-path: servermind/apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest

  web:
    name: Web (tsc, vitest, Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: servermind/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servermind/apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm run build:fixtures
      - name: dev-фикстуры не попали в production-бандл
        run: |
          if grep -rlF -e "demo-web-1" -e "seedServers" -e "mulberry32" .next/static .next/server --include='*.js'; then
            echo "::error::dev-фикстуры найдены в production-сборке"; exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=fixtures --project=production
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: servermind/apps/web/e2e/output
          retention-days: 7

  bootstrap:
    name: Установщик и автообновление (shellcheck, тесты, compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + тесты install.sh / update.sh (поддельный docker)
        run: bash servermind/bootstrap/tests/run.sh
      - name: валидность production compose
        working-directory: servermind/infra/compose
        run: |
          mkdir -p ../env && : > ../env/postgres.env && : > ../env/api.env
          SERVERMIND_API_IMAGE=ghcr.io/o/servermind-api@sha256:aaa SERVERMIND_WEB_IMAGE=ghcr.io/o/servermind-web@sha256:bbb docker compose config -q
          if SERVERMIND_API_IMAGE=x SERVERMIND_WEB_IMAGE=y docker compose config | grep -E "privileged|network_mode: host|docker.sock"; then
            echo "::error::в compose запрещённые настройки"; exit 1
          fi

  images:
    name: Образы (сборка + smoke-запуск)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка web
        uses: docker/build-push-action@v6
        with:
          context: servermind
          file: servermind/apps/web/Dockerfile
          load: true
          tags: servermind-web:ci
          build-args: API_BASE_URL=http://api:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Сборка api
        uses: docker/build-push-action@v6
        with:
          context: servermind
          file: servermind/apps/api/Dockerfile
          load: true
          tags: servermind-api:ci
          build-args: |
            WEB_IMAGE=ghcr.io/o/servermind-web@sha256:ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: smoke web (страница отдаётся, процесс не root)
        run: |
          docker run -d --name web -p 3000:3000 servermind-web:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/login && ok=1 && break; sleep 2; done
          [ "${ok:-}" = 1 ] || { docker logs web; exit 1; }
          [ "$(docker exec web id -u)" != 0 ] || { echo "::error::web запущен от root"; exit 1; }
      - name: smoke api (импорт приложения, пакет развёртывания, процесс не root)
        run: |
          docker run --rm -e ENCRYPTION_MASTER_KEY="$(head -c 32 /dev/urandom | base64 -w0)" servermind-api:ci \
            python -c "import app.main; print('import ok')"
          docker run --rm servermind-api:ci sh -c 'test -s /app/deploy/infra/compose/docker-compose.yml && test -s /app/deploy/infra/caddy/Caddyfile && test -s /app/deploy/bootstrap/update.sh && cat /app/deploy/release.json && [ "$(id -u)" != 0 ]'

  publish:
    name: Публикация образов в GHCR
    needs: [api, web, bootstrap, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
      api_digest: ${{ steps.api.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/servermind" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Сначала web: его digest запекается в release.json внутри api-образа, поэтому тег stable у API — единственный «переключатель» релиза
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: servermind
          file: servermind/apps/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.prefix }}-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: API_BASE_URL=http://api:8000
          cache-from: type=gha,scope=web
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: servermind
          file: servermind/apps/api/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            WEB_IMAGE=${{ steps.names.outputs.prefix }}-web@${{ steps.web.outputs.digest }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api

  promote:
    name: Выпуск на VPS (тег stable)
    needs: publish
    runs-on: ubuntu-24.04
    # Окружение `production`: в Settings → Environments можно включить обязательное одобрение — тогда обновление VPS
    # произойдёт только после вашего «Approve». Без правил тег двигается автоматически.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Переместить stable на проверенный digest
        env:
          PREFIX: ${{ needs.publish.outputs.prefix }}
          DIGEST: ${{ needs.publish.outputs.api_digest }}
        run: docker buildx imagetools create --tag "${PREFIX}-api:stable" "${PREFIX}-api@${DIGEST}"
