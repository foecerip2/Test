name: CI

on:
  pull_request:
    paths-ignore: ['.claude/**']
  push:
    branches: [main]
    paths-ignore: ['.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ВАЖНО: перед продакшном закрепите сторонние actions по commit SHA (ADR-007);
# версии по тегам ниже — официальные релизы, SHA не проверялись из среды разработки.
jobs:
  # Имя job `test` используется сервером: релиз разворачивается, только если для его коммита `test` завершился успешно.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright (Chromium)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Проверка сборки Docker-образа
        run: docker build -t lh-web:ci -f apps/web/Dockerfile .
      - name: Аудит зависимостей (прод)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Отчёт e2e при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 5

  # «Кнопка одобрения»: после зелёных тестов создаётся ЧЕРНОВИК релиза. Сервер видит только опубликованные релизы,
  # поэтому сайт обновится, когда владелец откроет черновик на GitHub и нажмёт «Publish release».
  draft-release:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Релиз $TAG" \
            --notes "Коммит: $GITHUB_SHA. Тесты пройдены. Нажмите «Publish release», чтобы обновить сайт на сервере (в течение нескольких минут)."
