name: CI/CD

on:
  pull_request:
    paths-ignore: ['servermind/**', '.claude/**']
  push:
    branches: [main]
    paths-ignore: ['servermind/**', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ВАЖНО: перед продакшном закрепите сторонние actions по commit SHA (ADR-007);
# версии по тегам ниже — официальные релизы, SHA не проверялись из среды разработки.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright (Chromium)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Аудит зависимостей (прод)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Отчёт e2e при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 5

  image:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Имя образа в нижнем регистре
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - name: Сборка и публикация
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
      - name: Ссылка на образ по digest
        id: ref
        run: echo "ref=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment `production` настраивается владельцем с Required reviewers: деплой стартует после его одобрения.
    environment:
      name: production
      url: https://ai.vaylonet.ru
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Деплой по digest (с проверкой здоровья и автооткатом на сервере)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          { printf '%s\n' "$GH_TOKEN"; tar czf - -C infra compose caddy; } | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "deploy@${DEPLOY_HOST}" "deploy ${IMAGE_REF} ${ACTOR}"
      - name: Проверка снаружи
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ai.vaylonet.ru/ || true)
            # 401 — работает, закрыт временным basic-auth; 200/307 — работает
            case "$code" in 200|307|401) echo "OK $code"; exit 0 ;; esac
            sleep 10
          done
          echo "Сайт не отвечает корректно" >&2; exit 1
