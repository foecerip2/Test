name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/android/**']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Приложение — оболочка вокруг https://ai.vaylonet.ru: весь интерфейс и логика обновляются вместе с сайтом.
# Собранный APK прикладывается к GitHub Release (скачивание прямо с телефона).
# Ключ подписи создаётся на лету: каждая сборка подписана новым ключом, поэтому поверх установленной
# версии APK обновить нельзя — сначала удалите старое приложение (данные хранятся на сервере, ничего не теряется).
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Синхронизация Capacitor
        run: pnpm --filter android exec cap sync android
      - name: Ключ подписи (временный) и сборка
        working-directory: apps/android/android
        run: |
          KPASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/lh.jks" -alias leadhunter -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KPASS" -keypass "$KPASS" -dname "CN=LeadHunter, O=LeadHunter, C=RU"
          LH_KEYSTORE="$RUNNER_TEMP/lh.jks" LH_KS_PASS="$KPASS" ./gradlew --no-daemon assembleRelease
      - name: Проверка подписи
        run: |
          APK=apps/android/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          cp "$APK" LeadHunter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeadHunter-apk
          path: LeadHunter.apk
          retention-days: 30
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-${{ github.run_number }}
        run: |
          gh release create "$TAG" LeadHunter.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Android $TAG" \
            --notes "APK приложения LeadHunter (оболочка сайта https://ai.vaylonet.ru). Коммит: $GITHUB_SHA. Ключ подписи временный: перед установкой новой версии удалите старую."
